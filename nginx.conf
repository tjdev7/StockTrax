# /etc/nginx/conf.d/stock_tracker.conf

# --- Upstream Pool: Your backend app instances ---
upstream stock_api_backend {
    # Balance load based on active connections – ideal for long-lived WebSockets
    least_conn; 

    # List your FastAPI instances here
    # 'max_fails' and 'fail_timeout' enable passive health checks
    server 127.0.0.1:8001 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8002 weight=5 max_fails=3 fail_timeout=30s;

    # Keep connections to backends open for efficiency
    keepalive 64; 
}

server {
    listen 80;
    server_name your_domain.com; # Replace with your domain

    # --- Route for WebSocket connections ---
    location /ws/ {
        proxy_pass http://stock_api_backend;
        
        # These headers are MANDATORY for WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Set long timeouts for persistent WebSocket connections
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Pass client details to your app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Route for standard REST API and dashboard ---
    location / {
        proxy_pass http://stock_api_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts for regular HTTP requests
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}