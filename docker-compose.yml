version: '3.8'

services:
  stock-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./stocks.db:/app/stocks.db
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    environment:
      - PYTHONUNBUFFERED=1
    # For zero downtime on updates, add --scale and use a reverse proxy (see README)